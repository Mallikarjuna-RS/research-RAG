# ========================================
# RESEARCH RAG PRO - NGINX CONFIGURATION
# Security hardening with WAF, rate limiting, DDoS protection
# ========================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Performance tuning
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # ========================================
    # LOGGING
    # ========================================
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    log_format json_combined escape=json
        '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent"'
        '}';
    
    access_log /var/log/nginx/access.log json_combined;
    
    # ========================================
    # PERFORMANCE SETTINGS
    # ========================================
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Client request limits
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # ========================================
    # GZIP COMPRESSION
    # ========================================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    
    # ========================================
    # RATE LIMITING ZONES
    # ========================================
    
    # General API rate limiting: 100 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    
    # Search endpoint: 20 requests/second per IP
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=20r/s;
    
    # Ingestion endpoint: 5 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=5r/m;
    
    # Connection limiting: max 50 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # Request body rate limiting (DDoS protection)
    limit_rate_after 500k;
    limit_rate 50k;
    
    # ========================================
    # SECURITY HEADERS
    # ========================================
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # XSS Protection
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:;" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # ========================================
    # SSL/TLS CONFIGURATION
    # ========================================
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # ========================================
    # UPSTREAM BACKENDS
    # ========================================
    
    upstream backend_api {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream frontend_app {
        least_conn;
        server frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # ========================================
    # SERVER BLOCKS
    # ========================================
    
    # HTTP to HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name rag.production.com;
        
        # Health check endpoint (no redirect)
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
        
        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
    # HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name rag.production.com;
        
        # SSL certificates
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
        
        # Connection limits
        limit_conn addr 50;
        
        # ========================================
        # SECURITY: BLOCK BAD REQUESTS
        # ========================================
        
        # Block requests with suspicious User-Agents
        if ($http_user_agent ~* (nmap|nikto|wikto|sf|sqlmap|bsqlbf|w3af|acunetix|havij|appscan)) {
            return 403;
        }
        
        # Block requests with no User-Agent
        if ($http_user_agent = "") {
            return 403;
        }
        
        # Block common exploit patterns in URI
        location ~ (\.|%2e)(\.|%2e)(%2f|%5c|/|\\) {
            return 403;
        }
        
        location ~ (\.php|\.asp|\.aspx|\.jsp)$ {
            return 403;
        }
        
        # ========================================
        # API ENDPOINTS
        # ========================================
        
        # Search endpoint with strict rate limiting
        location /api/v1/search {
            limit_req zone=search_limit burst=10 nodelay;
            limit_req_status 429;
            
            # CORS headers
            add_header Access-Control-Allow-Origin "https://rag.production.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
        
        # Ingestion endpoint with very strict rate limiting
        location /api/v1/ingest {
            limit_req zone=ingest_limit burst=2 nodelay;
            limit_req_status 429;
            
            # Require API key
            if ($http_x_api_key = "") {
                return 401;
            }
            
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeouts for ingestion
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Large body support
            client_max_body_size 100M;
        }
        
        # General API endpoints
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;
            
            # CORS headers
            add_header Access-Control-Allow-Origin "https://rag.production.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # WebSocket endpoint for real-time updates
        location /ws/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeouts for WebSocket
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }
        
        # Metrics endpoint (internal only)
        location /metrics {
            allow 10.0.0.0/8;  # VPC CIDR
            deny all;
            
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }
        
        # ========================================
        # FRONTEND APPLICATION
        # ========================================
        
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Caching for static assets
            location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://frontend_app;
                proxy_cache_valid 200 1d;
                add_header Cache-Control "public, max-age=86400";
                expires 1d;
            }
        }
        
        # ========================================
        # MONITORING & DEBUGGING
        # ========================================
        
        # Nginx status (internal only)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 10.0.0.0/8;
            deny all;
        }
    }
}
